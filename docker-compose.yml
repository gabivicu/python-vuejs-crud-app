version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: crudapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crudapp-network

  # Django backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crudapp-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crudapp-network
    restart: unless-stopped

  # Vue.js frontend - Development (Vite Dev Server with Hot Reload)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: crudapp-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - DOCKER=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - crudapp-network
    restart: unless-stopped
    # Use this for development - enables hot reload

  # Vue.js frontend - Production (Nginx Static Build)
  # Commented out for development - uncomment when you need production build
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: crudapp-frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - crudapp-network
  #   restart: unless-stopped
  #   # Use this for production - static build

volumes:
  redis-data:
  static_volume:

networks:
  crudapp-network:
    driver: bridge
